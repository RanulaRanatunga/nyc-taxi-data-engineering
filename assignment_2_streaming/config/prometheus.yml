global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: taxi-stream-producer
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          component: producer

  - job_name: taxi-stream-consumer
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          component: consumer
